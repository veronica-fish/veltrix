<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0A0A0B" />
<title>Profil Saya — VELTRIX</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="lang.js"></script>
<style>
:root{
  --bg:#0A0A0B;--surface:#141416;--surface-2:#1A1A1D;
  --border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.14);
  --text:#F2F2F3;--text-2:#A0A0A8;--text-3:#6B6B74;
  --gold:#E8B923;--danger:#F87171;--ok:#5EE3B0;
  --sh:0 6px 20px rgba(232,185,35,.22);
  --rm:10px;--rd:14px;--rl:20px;--rf:999px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}

.app{max-width:430px;margin:0 auto;min-height:100dvh;padding-bottom:40px}

.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;
  padding:12px 16px;background:rgba(10,10,11,.88);backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.back-btn{display:grid;place-items:center;width:34px;height:34px;flex:0 0 34px;
  border-radius:50%;background:var(--surface-2);border:1px solid var(--border)}
.back-btn svg{width:17px;height:17px}
.topbar-title{font-size:15px;font-weight:700;letter-spacing:-.01em}

.wrap{padding:16px}
.label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-3);margin-bottom:8px;margin-top:22px}
.label:first-child{margin-top:0}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);
  padding:4px 16px}
.info-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:13px 0}
.info-row+.info-row{border-top:1px solid var(--border)}
.info-key{font-size:11.5px;color:var(--text-3);flex:0 0 auto}
.info-val-wrap{display:flex;align-items:center;gap:8px;min-width:0}
.info-val{font-size:13px;font-weight:600;text-align:right;word-break:break-word}
.info-val.mono{font-family:ui-monospace,monospace;font-size:12px}
.copy-btn{flex:0 0 auto;display:grid;place-items:center;width:26px;height:26px;
  border-radius:8px;background:var(--surface-2);border:1px solid var(--border);
  color:var(--text-2);transition:color .15s,border-color .15s}
.copy-btn svg{width:13px;height:13px}
.copy-btn.copied{color:var(--ok);border-color:rgba(94,227,176,.4)}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);
  padding:14px}
.stat-num{font-size:19px;font-weight:700;color:var(--gold);letter-spacing:-.02em}
.stat-cap{font-size:11px;color:var(--text-3);margin-top:4px}

.badge-ok{font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:3px 9px;
  border-radius:var(--rf);background:rgba(52,211,153,.12);color:var(--ok)}
.badge-wait{font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:3px 9px;
  border-radius:var(--rf);background:rgba(232,185,35,.12);color:var(--gold)}

.empty-state{padding:80px 24px;text-align:center;color:var(--text-3);font-size:13px;line-height:1.7}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a href="profil.html" class="back-btn" aria-label="Kembali">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <div class="topbar-title" data-i18n="profilEdit.title">Profil Saya</div>
  </header>

  <div class="wrap" id="root">
    <div class="empty-state" data-i18n="profilEdit.memuat">Memuat profil…</div>
  </div>
</div>

<script>
(function(){
"use strict";

const SUPABASE_URL="https://rqqcdbbbcvhfjxznpowh.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_hTtIwFW3VFZj9p6qthAb3w_HbP5lVjs";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function fmtTgl(iso){
  if(!iso) return "-";
  const d=new Date(iso);
  if(isNaN(d.getTime())) return "-";
  const code = (typeof getLang==="function") ? getLang() : "id";
  const locale = code==="en" ? "en-US" : (code==="zh" ? "zh-CN" : "id-ID");
  return d.toLocaleDateString(locale,{day:"2-digit",month:"short",year:"numeric"})
    +" · "+d.toLocaleTimeString(locale,{hour:"2-digit",minute:"2-digit"});
}

function normalisasi(raw){
  const s=String(raw==null?"":raw).toLowerCase().trim();
  if(s==="belum_bayar"||s==="belum dibayarkan"||s==="pending") return "belum_bayar";
  if(s==="diproses"||s==="proses") return "diproses";
  if(s==="dikirim"||s==="sudah dikirim") return "dikirim";
  if(s==="selesai") return "selesai";
  if(s==="dibatalkan"||s==="batal") return "dibatalkan";
  return "lainnya";
}

function copySvg(){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
}
function checkSvg(){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
}

function salin(teks, btn){
  navigator.clipboard.writeText(teks).then(function(){
    btn.innerHTML = checkSvg();
    btn.classList.add("copied");
    setTimeout(function(){
      btn.innerHTML = copySvg();
      btn.classList.remove("copied");
    }, 1500);
  }).catch(function(){});
}

let STATE = { loaded:false, user:null, list:[], error:null };

async function loadData(){
  let USER=null;
  try{
    const {data:sessionData}=await sb.auth.getSession();
    USER = sessionData && sessionData.session ? sessionData.session.user : null;
  }catch(e){
    console.error("[auth]",e);
  }
  STATE.user = USER;
  if(!USER){ STATE.loaded=true; return; }

  const {data:trxData, error}=await sb.from("transactions")
    .select("status")
    .eq("user_id",USER.id);

  STATE.error = error || null;
  STATE.list = trxData || [];
  STATE.loaded = true;
}

function render(){
  const root=$("root");
  if(!STATE.loaded){
    root.innerHTML='<div class="empty-state">'+esc(t("profilEdit.memuat"))+'</div>';
    return;
  }
  if(!STATE.user){
    root.innerHTML='<div class="empty-state">'+esc(t("profilEdit.perluMasuk"))+'<br>'
      +'<a href="login.html" style="color:var(--gold);font-weight:600">'+esc(t("profilEdit.masukSekarang"))+'</a></div>';
    return;
  }
  if(STATE.error){
    root.innerHTML='<div class="empty-state" style="color:#F87171">'+esc(STATE.error.message)+'</div>';
    return;
  }

  const list = STATE.list;
  const totalTrx = list.length;
  const totalBeli = list.filter(function(tr){
    const n=normalisasi(tr.status);
    return n==="dikirim" || n==="selesai";
  }).length;

  const USER = STATE.user;
  const email = USER.email || "-";
  const idAkun = USER.id || "-";
  const bergabung = fmtTgl(USER.created_at);
  const loginTerakhir = fmtTgl(USER.last_sign_in_at);
  const terverifikasi = !!USER.email_confirmed_at;

  root.innerHTML = ''
    +'<div class="label">'+esc(t("profilEdit.sectionAkun"))+'</div>'
    +'<div class="card">'
    +  '<div class="info-row">'
    +    '<span class="info-key">'+esc(t("profilEdit.email"))+'</span>'
    +    '<div class="info-val-wrap"><span class="info-val">'+esc(email)+'</span></div>'
    +  '</div>'
    +  '<div class="info-row">'
    +    '<span class="info-key">'+esc(t("profilEdit.idAkun"))+'</span>'
    +    '<div class="info-val-wrap">'
    +      '<span class="info-val mono" id="idAkunText">'+esc(idAkun)+'</span>'
    +      '<button type="button" class="copy-btn" id="btnCopyId" aria-label="'+esc(t("profilEdit.salinId"))+'">'+copySvg()+'</button>'
    +    '</div>'
    +  '</div>'
    +'</div>'

    +'<div class="label">'+esc(t("profilEdit.sectionStat"))+'</div>'
    +'<div class="stat-grid">'
    +  '<div class="stat-box"><div class="stat-num">'+totalTrx+'</div><div class="stat-cap">'+esc(t("profilEdit.totalTrx"))+'</div></div>'
    +  '<div class="stat-box"><div class="stat-num">'+totalBeli+'</div><div class="stat-cap">'+esc(t("profilEdit.totalBeli"))+'</div></div>'
    +'</div>'

    +'<div class="label">'+esc(t("profilEdit.sectionTentang"))+'</div>'
    +'<div class="card">'
    +  '<div class="info-row"><span class="info-key">'+esc(t("profilEdit.bergabung"))+'</span><span class="info-val">'+esc(bergabung)+'</span></div>'
    +  '<div class="info-row"><span class="info-key">'+esc(t("profilEdit.loginTerakhir"))+'</span><span class="info-val">'+esc(loginTerakhir)+'</span></div>'
    +  '<div class="info-row"><span class="info-key">'+esc(t("profilEdit.statusAkun"))+'</span>'
    +    (terverifikasi
        ? '<span class="badge-ok">'+esc(t("profilEdit.aktif"))+'</span>'
        : '<span class="badge-wait">'+esc(t("profilEdit.belumVerif"))+'</span>')
    +  '</div>'
    +'</div>';

  const btn = $("btnCopyId");
  if(btn){
    btn.addEventListener("click", function(){
      salin(idAkun, btn);
    });
  }
}

async function init(){
  render(); // tampilkan "Memuat profil…"
  await loadData();
  render();
}

document.addEventListener("langchange", render);

init();

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0B" />
  <title>VELTRIX — Isi Saldo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --bg:#0A0A0B;--surface:#141416;--surface-2:#1A1A1D;
      --border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.14);
      --text:#F2F2F3;--text-2:#A0A0A8;--text-3:#6B6B74;
      --gold:#E8B923;--gold-soft:rgba(232,185,35,.12);
      --success:#34D399;--danger:#F87171;--info:#60A5FA;
      --r-sm:10px;--r-md:14px;--r-lg:20px;--r-full:999px;
      --sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;
      --nav-h:68px;--shadow-gold:0 6px 20px rgba(232,185,35,.22);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{-webkit-text-size-adjust:100%}
    body{
      background:var(--bg);color:var(--text);
      font-family:'Inter',system-ui,-apple-system,sans-serif;
      font-size:14px;line-height:1.55;
      -webkit-font-smoothing:antialiased;
    }
    img,svg{display:block;max-width:100%}
    img{-webkit-user-drag:none;user-select:none;-webkit-touch-callout:none}
    a{color:inherit;text-decoration:none}
    button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
    :focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}

    .app{
      max-width:430px;margin:0 auto;min-height:100dvh;
      padding-bottom:calc(var(--nav-h) + var(--sp-6) + env(safe-area-inset-bottom));
    }

    .topbar{
      position:sticky;top:0;z-index:60;
      display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);
      padding:var(--sp-3) var(--sp-4);
      background:rgba(10,10,11,.88);
      backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      border-bottom:1px solid var(--border);
    }
    .brand{height:30px;width:auto}

    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);
      height:44px;padding:0 var(--sp-5);border-radius:var(--r-md);
      font-size:14px;font-weight:600;letter-spacing:-.01em;
      white-space:nowrap;user-select:none;
      transition:background .15s,opacity .15s,transform .1s,box-shadow .15s;
    }
    .btn:active{transform:scale(.98)}
    .btn:disabled{opacity:.45;pointer-events:none}
    .btn-block{display:flex;width:100%}
    .btn-primary{background:var(--gold);color:#0A0A0B;box-shadow:var(--shadow-gold)}
    .btn-primary:hover{background:#F0C43A}
    .btn-ghost{background:transparent;color:var(--text-2);border:1px solid var(--border)}
    .btn-ghost:hover{color:var(--text);border-color:var(--border-strong)}
    .btn-sm{height:36px;padding:0 var(--sp-4);font-size:13px;border-radius:var(--r-sm)}

    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
    .card-pad{padding:var(--sp-4)}

    .label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
    .body-sm{font-size:13px;line-height:1.55;color:var(--text-2)}

    .bottom-nav{
      position:fixed;bottom:0;left:0;right:0;z-index:70;
      display:flex;justify-content:center;
      background:rgba(15,15,17,.94);
      backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
      border-top:1px solid var(--border);
      padding-bottom:env(safe-area-inset-bottom);
    }
    .bottom-nav-inner{
      display:flex;align-items:stretch;
      width:100%;max-width:430px;height:var(--nav-h);
    }
    .nav-item{
      flex:1;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:3px;
      color:var(--text-3);font-size:10.5px;font-weight:600;
      transition:color .15s;-webkit-tap-highlight-color:transparent;
    }
    .nav-item svg{width:21px;height:21px}
    .nav-item.active{color:var(--gold)}
    .nav-item:active{opacity:.7}
    .nav-buy{flex:0 0 68px;position:relative}
    .nav-buy-btn{
      width:54px;height:54px;border-radius:50%;
      background:var(--gold);display:grid;place-items:center;
      box-shadow:var(--shadow-gold);margin-top:-22px;
      transition:transform .12s;
    }
    .nav-buy-btn svg{width:23px;height:23px;color:#0A0A0B}
    .nav-buy:active .nav-buy-btn{transform:scale(.95)}
    .nav-buy .nav-label-buy{color:var(--gold);font-weight:700}

    .methods{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2)}
    .method{
      display:flex;flex-direction:column;gap:10px;
      padding:var(--sp-3);text-align:left;
      background:var(--surface-2);border:1px solid var(--border);
      border-radius:var(--r-md);
      transition:border-color .15s,background .15s;
    }
    .method[aria-checked="true"]{
      border-color:rgba(232,185,35,.55);background:var(--gold-soft);
    }
    .method-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .method-name{font-size:13.5px;font-weight:700;letter-spacing:-.01em}

    .opt-dot{
      flex:0 0 16px;width:16px;height:16px;border-radius:50%;
      border:1.5px solid var(--border-strong);
      display:grid;place-items:center;transition:border-color .15s;
    }
    .method[aria-checked="true"] .opt-dot{border-color:var(--gold)}
    .method[aria-checked="true"] .opt-dot::after{
      content:"";width:8px;height:8px;border-radius:50%;background:var(--gold);
    }

    .logos{display:flex;gap:6px}
    .logo-box{
      width:34px;height:34px;flex:0 0 34px;
      display:grid;place-items:center;overflow:hidden;
      background:#fff;border-radius:8px;
      user-select:none;-webkit-user-select:none;
      -webkit-touch-callout:none;
    }
    .logo-box img{
      width:100%;height:100%;object-fit:contain;padding:5px;
      pointer-events:none;-webkit-user-drag:none;
      user-select:none;-webkit-user-select:none;
      -webkit-touch-callout:none;
    }

    .field{
      display:flex;align-items:center;gap:var(--sp-3);
      padding:0 var(--sp-4);
      background:var(--surface-2);border:1px solid var(--border);
      border-radius:var(--r-md);
      transition:border-color .15s,box-shadow .15s;
    }
    .field:focus-within{
      border-color:rgba(232,185,35,.55);
      box-shadow:0 0 0 3px var(--gold-soft);
    }
    .field .unit{
      flex:0 0 auto;font-size:12.5px;font-weight:700;color:var(--text-3);
      letter-spacing:.02em;
    }
    .field input{
      flex:1;min-width:0;padding:13px 0;
      background:none;border:0;outline:none;color:var(--text);
      font:inherit;font-size:20px;font-weight:700;letter-spacing:-.02em;
      font-variant-numeric:tabular-nums;
    }
    .field input::placeholder{color:var(--text-3);font-weight:600}

    .chips{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
    .chip{
      padding:6px 12px;border-radius:var(--r-full);
      font-size:12px;font-weight:600;color:var(--text-2);
      background:transparent;border:1px solid var(--border);
      transition:border-color .15s,color .15s,background .15s;
    }
    .chip:hover{color:var(--text);border-color:var(--border-strong);background:var(--surface-2)}

    .alert{
      display:none;margin-top:var(--sp-3);
      padding:10px var(--sp-3);border-radius:var(--r-sm);
      font-size:13px;line-height:1.45;
      color:var(--danger);background:rgba(248,113,113,.1);
      border:1px solid rgba(248,113,113,.25);
    }
    .alert.show{display:block}

    .spin{
      width:14px;height:14px;border-radius:50%;flex:0 0 auto;
      border:2px solid rgba(10,10,11,.3);border-top-color:#0A0A0B;
      animation:sp .7s linear infinite;
    }
    @keyframes sp{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}}

    .foot{font-size:11.5px;color:var(--text-3);line-height:1.5;margin-top:var(--sp-4)}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <img src="https://raw.githubusercontent.com/veronica-fish/veltrix/main/img/logo.png" alt="VELTRIX" class="brand" />
      <a href="index.html" class="btn btn-ghost btn-sm" id="backBtn"></a>
    </header>

    <main style="padding:16px;display:flex;flex-direction:column;gap:16px">

      <div>
        <div class="label" id="methodLabel" style="margin-bottom:10px"></div>
        <div class="methods" role="radiogroup" id="methodGroup">

          <button type="button" class="method" role="radio" aria-checked="false"
                  data-gw="mercanpay" data-ccy="USDT">
            <span class="method-top">
              <span class="method-name">USDT</span>
              <span class="opt-dot"></span>
            </span>
            <span class="logos">
              <span class="logo-box"><img src="https://raw.githubusercontent.com/veronica-fish/veltrix/main/img/usdt.png" alt="USDT" draggable="false" /></span>
              <span class="logo-box"><img src="https://raw.githubusercontent.com/veronica-fish/veltrix/main/img/tron.png" alt="TRON" draggable="false" /></span>
            </span>
          </button>

          <button type="button" class="method" role="radio" aria-checked="true"
                  data-gw="cashi" data-ccy="IDR">
            <span class="method-top">
              <span class="method-name">IDR</span>
              <span class="opt-dot"></span>
            </span>
            <span class="logos">
              <span class="logo-box"><img src="https://raw.githubusercontent.com/veronica-fish/veltrix/main/img/qris.png" alt="QRIS" draggable="false" /></span>
              <span class="logo-box"><img src="https://raw.githubusercontent.com/veronica-fish/veltrix/main/img/visa.png" alt="Visa" draggable="false" /></span>
            </span>
          </button>
        </div>
      </div>

      <div class="card">
        <div class="card-pad" style="border-bottom:1px solid var(--border)">
          <div class="label" id="amountLabel" style="margin-bottom:10px"></div>
          <div class="field">
            <span class="unit" id="unit">Rp</span>
            <input id="nominal" type="text" inputmode="numeric" autocomplete="off" placeholder="0" />
          </div>
          <div class="chips" id="chips" style="margin-top:10px"></div>
        </div>

        <div class="card-pad">
          <p class="body-sm" id="note" style="margin-bottom:14px"></p>

          <button type="button" class="btn btn-primary btn-block" id="btn">
            <span id="btnText"></span>
          </button>

          <div class="alert" id="err" role="alert"></div>

          <p class="foot" id="foot"></p>
        </div>
      </div>

    </main>
  </div>

  <nav class="bottom-nav">
    <div class="bottom-nav-inner">
      <a href="index.html" class="nav-item" id="navHome">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/>
        </svg>
        <span></span>
      </a>
      <a href="isi-saldo.html" class="nav-item active" id="navTopup">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="6" width="18" height="13" rx="3"/><path d="M16 12.5h2.5"/><path d="M3 10h18"/>
        </svg>
        <span></span>
      </a>
      <a href="beli.html" class="nav-item nav-buy" id="navBuy">
        <div class="nav-buy-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/>
            <path d="M2.5 3.5h2.2l2.5 11h10.3l1.9-7.5H6.2"/>
          </svg>
        </div>
        <span class="nav-label-buy" id="navBuyLbl"></span>
      </a>
      <a href="transaksi.html" class="nav-item" id="navTx">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9.5 8.5h5"/><path d="M9.5 12.5h5"/>
        </svg>
        <span></span>
      </a>
      <a href="profil.html" class="nav-item" id="navProfile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/>
        </svg>
        <span></span>
      </a>
    </div>
  </nav>

  <script src="lang.js"></script>
  <script>
    const SUPABASE_URL = "https://rqqcdbbbcvhfjxznpowh.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_hTtIwFW3VFZj9p6qthAb3w_HbP5lVjs";
    const EDGE_FUNCTION_URL = SUPABASE_URL + "/functions/v1/create-topup";

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function tr(key){
      return typeof window.t === "function" ? window.t(key) : key;
    }

    const CFG = {
      IDR: {
        labelKey: "isiSaldo.labelJumlahIdr",
        unit: "Rp",
        min: 5000,
        max: 100000000,
        noteKey: "isiSaldo.noteIdr",
        footKey: "isiSaldo.footIdr",
        chips: [50000, 100000, 250000, 500000],
chipLabel: v => (v / 1000) + " " + tr("isiSaldo.chipRb")

      },
      USDT: {
        labelKey: "isiSaldo.labelJumlahUsdt",
        unit: "USDT",
        min: 10,
        max: 100000,
        noteKey: "isiSaldo.noteUsdt",
        footKey: "isiSaldo.footUsdt",
        chips: [10, 25, 50, 100],
        chipLabel: v => v + " USDT"
      }
    };

    const $ = id => document.getElementById(id);
    const inputEl = $("nominal"), btnEl = $("btn"), btnText = $("btnText"),
          errEl = $("err"), chipsEl = $("chips");

    let gw = "cashi";
    let ccy = "IDR";

    const digitsOnly = s => s.replace(/[^\d]/g, "");
    const group = n => n.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    const rawValue = () => Number(digitsOnly(inputEl.value) || 0);

    function showError(msg){ errEl.textContent = msg; errEl.classList.add("show"); }
    function clearError(){ errEl.classList.remove("show"); errEl.textContent = ""; }

    function renderMethod(){
      const c = CFG[ccy];

      $("amountLabel").textContent = tr(c.labelKey);
      $("unit").textContent = c.unit;
      $("note").textContent = tr(c.noteKey);
      $("foot").textContent = tr(c.footKey);

      inputEl.value = "";
      inputEl.placeholder = "0";

      chipsEl.innerHTML = "";
      for (const v of c.chips){
        const b = document.createElement("button");
        b.type = "button";
        b.className = "chip";
        b.textContent = c.chipLabel(v);
        b.addEventListener("click", () => {
          inputEl.value = group(String(v));
          clearError();
        });
        chipsEl.appendChild(b);
      }

      clearError();
    }

    function updateStaticLabels(){
      $("methodLabel").textContent = tr("isiSaldo.labelMetode");
      $("backBtn").textContent = tr("common.back");
      $("btnText").textContent = tr("isiSaldo.lanjutkan");
      
      $("navHome").querySelector("span").textContent = tr("nav.home");
      $("navTopup").querySelector("span").textContent = tr("nav.isisaldo");
      $("navBuyLbl").textContent = tr("nav.beli");
      $("navTx").querySelector("span").textContent = tr("nav.transaksi");
      $("navProfile").querySelector("span").textContent = tr("nav.profil");
      
      renderMethod();
    }

    inputEl.addEventListener("input", () => {
      const d = digitsOnly(inputEl.value).slice(0, 12);
      inputEl.value = d ? group(d) : "";
      clearError();
    });

    document.querySelectorAll(".method").forEach(el => {
      el.addEventListener("click", () => {
        document.querySelectorAll(".method")
          .forEach(o => o.setAttribute("aria-checked", "false"));
        el.setAttribute("aria-checked", "true");
        gw = el.dataset.gw;
        ccy = el.dataset.ccy;
        renderMethod();
      });
    });

    function setLoading(on){
      btnEl.disabled = on;
      btnEl.querySelector(".spin")?.remove();
      if (on){
        const sp = document.createElement("span");
        sp.className = "spin";
        btnEl.prepend(sp);
        btnText.textContent = tr("isiSaldo.memproses");
      } else {
        btnText.textContent = tr("isiSaldo.lanjutkan");
      }
    }

    btnEl.addEventListener("click", async () => {
      clearError();

      const c = CFG[ccy];
      const nominal = rawValue();

      if (!nominal) return showError(tr("isiSaldo.errKosong"));
      if (nominal < c.min){
        const minText = ccy === "IDR"
          ? "Rp " + c.min.toLocaleString("id-ID")
          : c.min + " USDT";
        return showError(tr("isiSaldo.errMinimal").replace("{min}", minText));
      }
      if (nominal > c.max){
        return showError(tr("isiSaldo.errMaksimal"));
      }

      setLoading(true);
      try {
        const { data: { session }, error: sErr } = await sb.auth.getSession();
        if (sErr || !session){
          return showError(tr("isiSaldo.errSesi"));
        }

        const res = await fetch(EDGE_FUNCTION_URL, {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + session.access_token,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ gateway: gw, nominal })
        });

        const text = await res.text();
        let data = {};
        try { data = JSON.parse(text); } catch {}

        if (!res.ok || !data.payment_url){
          return showError(data.error || tr("isiSaldo.errGagal"));
        }

        btnText.textContent = tr("isiSaldo.mengalihkan");
        window.location.href = data.payment_url;
      } catch (e){
        console.error(e);
        showError(tr("isiSaldo.errServer"));
      } finally {
        setLoading(false);
      }
    });

    document.addEventListener("langchange", () => {
      updateStaticLabels();
    });

    updateStaticLabels();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0B" />
  <title>Beli — VELTRIX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --bg:#0A0A0B;--surface:#141416;--surface-2:#1A1A1D;
      --border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.14);
      --text:#F2F2F3;--text-2:#A0A0A8;--text-3:#6B6B74;
      --gold:#E8B923;--shadow-gold:0 6px 20px rgba(232,185,35,.22);
      --r-sm:10px;--r-md:14px;--r-lg:20px;--r-full:999px;
      --sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;
      --nav-h:68px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{
      background:var(--bg);color:var(--text);
      font-family:'Inter',system-ui,-apple-system,sans-serif;
      font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
    }
    img,svg{display:block;max-width:100%}
    img{-webkit-user-drag:none;user-select:none;-webkit-touch-callout:none}
    a{color:inherit;text-decoration:none}
    button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
    :focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}

    .app{
      max-width:430px;margin:0 auto;min-height:100dvh;
      padding-bottom:calc(var(--nav-h) + var(--sp-6) + env(safe-area-inset-bottom));
    }

    .topbar{
      position:sticky;top:0;z-index:60;
      display:flex;align-items:center;gap:var(--sp-3);
      padding:var(--sp-3) var(--sp-4);
      background:rgba(10,10,11,.88);
      backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      border-bottom:1px solid var(--border);
    }
    .back-btn{
      display:grid;place-items:center;width:34px;height:34px;flex:0 0 34px;
      border-radius:50%;background:var(--surface-2);border:1px solid var(--border);
    }
    .back-btn svg{width:17px;height:17px}
    .topbar-title{font-size:15px;font-weight:700;letter-spacing:-.01em}

    .label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}

    .prod-list{display:flex;flex-direction:column;gap:var(--sp-3);padding:16px}
    .prod-card{
      display:flex;gap:12px;align-items:center;
      background:var(--surface);border:1px solid var(--border);
      border-radius:var(--r-lg);padding:12px;
      transition:border-color .15s;
    }
    .prod-card:hover{border-color:rgba(232,185,35,.4)}

    .prod-thumb{
      position:relative;width:76px;height:76px;flex:0 0 76px;
      border-radius:var(--r-md);overflow:hidden;background:#fff;
    }
    .prod-thumb img{
      width:100%;height:100%;object-fit:cover;
      pointer-events:none;-webkit-user-drag:none;user-select:none;-webkit-touch-callout:none;
    }
    .prod-tag{
      position:absolute;top:5px;left:5px;
      font-size:8.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
      padding:3px 6px;border-radius:var(--r-full);
      background:var(--gold);color:#0A0A0B;
    }
    .prod-tag.hot{background:#F87171;color:#fff}

    .prod-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
    .prod-name{font-size:13.5px;font-weight:600;line-height:1.3}
    .prod-sub{font-size:11px;color:var(--text-3)}
    .prod-prices{display:flex;align-items:baseline;gap:6px;margin-top:2px}
    .prod-usdt{font-size:15px;font-weight:700;color:var(--gold);letter-spacing:-.02em}
    .prod-idr{font-size:11px;color:var(--text-3)}

    .prod-stock{
      display:inline-flex;align-items:center;gap:5px;
      align-self:flex-start;margin-top:5px;
      font-size:10px;font-weight:700;letter-spacing:.02em;
      padding:3px 9px;border-radius:var(--r-full);
      background:rgba(52,211,153,.12);color:#5EE3B0;
      border:1px solid rgba(52,211,153,.22);
    }
    .prod-stock-dot{width:5px;height:5px;border-radius:50%;background:#5EE3B0;flex:0 0 auto}

    .btn-beli{
      flex:0 0 auto;height:36px;padding:0 16px;border-radius:var(--r-sm);
      font-size:12.5px;font-weight:700;
      background:var(--gold);color:#0A0A0B;
      display:grid;place-items:center;
      box-shadow:var(--shadow-gold);
      transition:background .15s,transform .1s;
    }
    .btn-beli:hover{background:#F0C43A}
    .btn-beli:active{transform:scale(.96)}

    .bottom-nav{
      position:fixed;bottom:0;left:0;right:0;z-index:70;
      display:flex;justify-content:center;
      background:rgba(15,15,17,.94);
      backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
      border-top:1px solid var(--border);
      padding-bottom:env(safe-area-inset-bottom);
    }
    .bottom-nav-inner{display:flex;align-items:stretch;width:100%;max-width:430px;height:var(--nav-h)}
    .nav-item{
      flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
      color:var(--text-3);font-size:10.5px;font-weight:600;transition:color .15s;
      -webkit-tap-highlight-color:transparent;
    }
    .nav-item svg{width:21px;height:21px}
    .nav-item.active{color:var(--gold)}
    .nav-item:active{opacity:.7}
    .nav-buy{flex:0 0 68px;position:relative}
    .nav-buy-btn{
      width:54px;height:54px;border-radius:50%;background:var(--gold);
      display:grid;place-items:center;box-shadow:var(--shadow-gold);margin-top:-22px;
      transition:transform .12s;
    }
    .nav-buy-btn svg{width:23px;height:23px;color:#0A0A0B}
    .nav-buy:active .nav-buy-btn{transform:scale(.95)}
    .nav-buy .nav-label-buy{color:var(--gold);font-weight:700}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a href="index.html" class="back-btn" aria-label="Kembali" data-i18n-aria="common.back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </a>
      <div class="topbar-title" data-i18n="topbar.beli">Beli Produk</div>
    </header>

    <main>
      <div class="prod-list" id="produk">
        <div style="padding:40px 24px;text-align:center;color:var(--text-3);font-size:13px"
             data-i18n="prod.memuat">Memuat produk…</div>
      </div>
    </main>
  </div>

  <nav class="bottom-nav">
    <div class="bottom-nav-inner">
      <a href="index.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/>
        </svg>
        <span data-i18n="nav.home">Home</span>
      </a>
      <a href="isi-saldo.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="6" width="18" height="13" rx="3"/><path d="M16 12.5h2.5"/><path d="M3 10h18"/>
        </svg>
        <span data-i18n="nav.isisaldo">Isi Saldo</span>
      </a>
      <a href="beli.html" class="nav-item nav-buy active">
        <div class="nav-buy-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/>
            <path d="M2.5 3.5h2.2l2.5 11h10.3l1.9-7.5H6.2"/>
          </svg>
        </div>
        <span class="nav-label-buy" data-i18n="nav.beli">Beli</span>
      </a>
      <a href="transaksi.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9.5 8.5h5"/><path d="M9.5 12.5h5"/>
        </svg>
        <span data-i18n="nav.transaksi">Transaksi</span>
      </a>
      <a href="profil.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/>
        </svg>
        <span data-i18n="nav.profil">Profil</span>
      </a>
    </div>
  </nav>

  <script src="lang.js"></script>
  <script>
    const SUPABASE_URL="https://rqqcdbbbcvhfjxznpowh.supabase.co";
    const SUPABASE_ANON_KEY="sb_publishable_hTtIwFW3VFZj9p6qthAb3w_HbP5lVjs";
    const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

    /* ---------- bahasa ---------- */
    const curLang = () =>
      (window.getLang ? getLang() : (localStorage.getItem("veltrix_lang") || "id"));

    function T(key, fallback){
      if (window.LANG && window.LANG[curLang()] && window.LANG[curLang()][key] !== undefined)
        return window.LANG[curLang()][key];
      if (window.t){
        const v = t(key);
        if (v && v !== key) return v;
      }
      return fallback !== undefined ? fallback : key;
    }

    const esc    = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    const rupiah = n => "Rp " + Number(n||0).toLocaleString("id-ID");
    const usdt   = n => "$" + Number(n||0).toLocaleString("id-ID",{minimumFractionDigits:2,maximumFractionDigits:2});

    const IMG = "https://raw.githubusercontent.com/veronica-fish/veltrix/main/img/";
    const IMG_MAP = { metaone:"metaone.png", otp:"otp.png", agmail:"agmail.png" };

    function imgOf(p){
      const d = p.gambar || p.img || p.image;
      if (d) return /^https?:/.test(d) ? d : IMG + d;
      if (p.slug && IMG_MAP[p.slug]) return IMG + IMG_MAP[p.slug];
      const n = (p.nama||"").toLowerCase();
      if (n.includes("metaone")) return IMG + "metaone.png";
      if (n.includes("code"))    return IMG + "otp.png";
      if (n.includes("account")) return IMG + "agmail.png";
      return IMG + "metaone.png";
    }

    function namaOf(p){
      const L = curLang();
      return p["nama_" + L] || p.nama || "";
    }

    let produkData = null;

    function renderProduk(){
      const el = document.getElementById("produk");

      if (produkData === null){
        el.innerHTML = '<div style="padding:40px 24px;text-align:center;color:var(--text-3);font-size:13px">'
                     + esc(T("prod.memuat","Memuat produk…")) + '</div>';
        return;
      }
      if (produkData.error){
        el.innerHTML = '<div style="padding:40px 24px;text-align:center;color:#F87171;font-size:13px">'
                     + esc(produkData.error) + '</div>';
        return;
      }
      if (!produkData.length){
        el.innerHTML = '<div style="padding:40px 24px;text-align:center;color:var(--text-3);font-size:13px">'
                     + esc(T("prod.kosong","Belum ada produk.")) + '</div>';
        return;
      }

      el.innerHTML = produkData.map(p => {
        const nv       = (p.product_variants||[]).filter(v => v.aktif !== false).length;
        const tag      = p.tag || null;
        const tagClass = tag === "Hot" ? "prod-tag hot" : "prod-tag";
        const nama     = namaOf(p);
        return `
        <div class="prod-card">
          <div class="prod-thumb">
            <img src="${imgOf(p)}" alt="${esc(nama)}" loading="lazy" draggable="false" />
            ${tag ? `<span class="${tagClass}">${esc(tag)}</span>` : ""}
          </div>
          <div class="prod-info">
            <div class="prod-name">${esc(nama)}</div>
            <div class="prod-sub">${nv} ${esc(T("prod.pilihan","pilihan"))}</div>
            <div class="prod-prices">
              <span class="prod-usdt">${usdt(p.harga_usdt)}</span>
              <span class="prod-idr">${rupiah(p.harga_idr)}</span>
            </div>
            <span class="prod-stock">
              <span class="prod-stock-dot"></span>
              ${esc(T("prod.tersedia","Tersedia"))}
            </span>
          </div>
          <a class="btn-beli" href="rincian.html?id=${encodeURIComponent(p.id)}">${esc(T("prod.beli","Beli"))}</a>
        </div>`;
      }).join("");
    }

    async function muatProduk(){
      const { data, error } = await sb.from("products")
        .select("*,product_variants(id,aktif)")
        .eq("aktif", true)
        .order("urutan");

      if (error){
        produkData = { error: error.message };
      } else {
        produkData = data || [];
      }
      renderProduk();
    }

    document.addEventListener("langchange", function(){
      if (window.applyLang) applyLang(curLang());
      renderProduk();
    });

    if (window.applyLang) applyLang(curLang());
    muatProduk();
  </script>
</body>
</html>

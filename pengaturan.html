<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0A0A0B" />
<title>Pengaturan Akun — VELTRIX</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0A0A0B;--surface:#141416;--surface-2:#1A1A1D;
  --border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.14);
  --text:#F2F2F3;--text-2:#A0A0A8;--text-3:#6B6B74;
  --gold:#E8B923;--danger:#F87171;--ok:#5EE3B0;
  --sh:0 6px 20px rgba(232,185,35,.22);
  --rm:10px;--rd:14px;--rl:20px;--rf:999px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}

.app{max-width:430px;margin:0 auto;min-height:100dvh;padding-bottom:40px}

.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;
  padding:12px 16px;background:rgba(10,10,11,.88);backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.back-btn{display:grid;place-items:center;width:34px;height:34px;flex:0 0 34px;
  border-radius:50%;background:var(--surface-2);border:1px solid var(--border)}
.back-btn svg{width:17px;height:17px}
.topbar-title{font-size:15px;font-weight:700;letter-spacing:-.01em}

.wrap{padding:16px}
.label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-3);margin-bottom:8px;margin-top:22px}
.label:first-child{margin-top:0}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);
  padding:4px 16px}
.info-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0}
.info-row+.info-row{border-top:1px solid var(--border)}
.info-key{font-size:11.5px;color:var(--text-3);flex:0 0 auto}
.info-val{font-size:13px;font-weight:600;text-align:right;word-break:break-word}

.menu-list{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);
  overflow:hidden}
.menu-row{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;text-align:left;
  transition:background .15s}
.menu-row:not(:last-child){border-bottom:1px solid var(--border)}
.menu-row:active{background:var(--surface-2)}
.menu-icon{width:34px;height:34px;flex:0 0 34px;border-radius:10px;
  background:var(--surface-2);border:1px solid var(--border);
  display:grid;place-items:center;color:var(--text-2)}
.menu-icon svg{width:17px;height:17px}
.menu-text{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.menu-title{font-size:13.5px;font-weight:600}
.menu-sub{font-size:11px;color:var(--text-3)}
.menu-chev{color:var(--text-3);flex:0 0 auto}
.menu-chev svg{width:16px;height:16px}

.empty-state{padding:80px 24px;text-align:center;color:var(--text-3);font-size:13px;line-height:1.7}

/* Modal */
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:flex-end;justify-content:center;
  background:rgba(0,0,0,.72);backdrop-filter:blur(4px)}
.modal.show{display:flex}
.modal-card{width:100%;max-width:430px;background:var(--surface);
  border-radius:var(--rl) var(--rl) 0 0;border:1px solid var(--border);border-bottom:none;
  padding:20px 16px calc(20px + env(safe-area-inset-bottom));
  animation:slideUp .25s cubic-bezier(.4,0,.2,1);max-height:92dvh;overflow-y:auto}
@keyframes slideUp{from{transform:translateY(24px);opacity:.6}to{transform:translateY(0);opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-title{font-size:15px;font-weight:700}
.modal-sub{font-size:12px;color:var(--text-3);margin-top:3px}
.modal-close{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  color:var(--text-3);background:var(--surface-2)}
.modal-close svg{width:15px;height:15px}

.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field:first-of-type{margin-top:0}
.field-label{font-size:11.5px;font-weight:600;color:var(--text-2)}
.field-input{height:44px;padding:0 13px;border-radius:var(--rd);
  background:var(--surface-2);border:1.5px solid var(--border);color:var(--text);
  font-size:13.5px;width:100%;transition:border-color .15s}
.field-input:focus{border-color:var(--gold)}
.field-input::placeholder{color:var(--text-3)}

.form-msg{font-size:12px;line-height:1.5;margin-top:12px;display:none}
.form-msg.show{display:block}
.form-msg.err{color:#FCA5A5}
.form-msg.ok{color:var(--ok)}

.modal-actions{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.btn-primary{height:46px;border-radius:var(--rd);font-size:14px;font-weight:700;
  background:var(--gold);color:#0A0A0B;box-shadow:var(--sh);display:grid;place-items:center;
  transition:background .15s,transform .1s}
.btn-primary:hover{background:#F0C43A}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{opacity:.4;pointer-events:none;box-shadow:none}
.btn-ghost{height:44px;border-radius:var(--rd);font-size:13.5px;font-weight:600;
  color:var(--text-2);border:1px solid var(--border);display:grid;place-items:center;
  transition:color .15s,border-color .15s}
.btn-ghost:hover{color:var(--text);border-color:var(--border-strong)}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a href="profil.html" class="back-btn" aria-label="Kembali">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <div class="topbar-title" id="topbarTitle"></div>
  </header>

  <div class="wrap" id="root">
    <div class="empty-state" id="loadingText"></div>
  </div>
</div>

<!-- Modal: Ganti Email -->
<div class="modal" id="emailModal">
  <div class="modal-card">
    <div class="modal-head">
      <div>
        <div class="modal-title" id="emailModalTitle"></div>
        <div class="modal-sub" id="emailModalSub"></div>
      </div>
      <button type="button" class="modal-close" data-close="emailModal" aria-label="Tutup">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="field">
      <label class="field-label" id="emailModalLblBaru"></label>
      <input type="email" class="field-input" id="emailBaru" placeholder="" autocomplete="email" />
    </div>
    <div class="field">
      <label class="field-label" id="emailModalLblPw"></label>
      <input type="password" class="field-input" id="emailPwSaatIni" placeholder="" autocomplete="current-password" />
    </div>

    <div class="form-msg" id="emailMsg"></div>

    <div class="modal-actions">
      <button type="button" class="btn-primary" id="btnGantiEmail"></button>
      <button type="button" class="btn-ghost" data-close="emailModal" id="batalEmailBtn"></button>
    </div>
  </div>
</div>

<!-- Modal: Ganti Kata Sandi -->
<div class="modal" id="pwModal">
  <div class="modal-card">
    <div class="modal-head">
      <div>
        <div class="modal-title" id="pwModalTitle"></div>
        <div class="modal-sub" id="pwModalSub"></div>
      </div>
      <button type="button" class="modal-close" data-close="pwModal" aria-label="Tutup">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="field">
      <label class="field-label" id="pwModalLblSaatIni"></label>
      <input type="password" class="field-input" id="pwSaatIni" placeholder="" autocomplete="current-password" />
    </div>
    <div class="field">
      <label class="field-label" id="pwModalLblBaru"></label>
      <input type="password" class="field-input" id="pwBaru" placeholder="" autocomplete="new-password" />
    </div>
    <div class="field">
      <label class="field-label" id="pwModalLblKonfirmasi"></label>
      <input type="password" class="field-input" id="pwKonfirmasi" placeholder="" autocomplete="new-password" />
    </div>

    <div class="form-msg" id="pwMsg"></div>

    <div class="modal-actions">
      <button type="button" class="btn-primary" id="btnGantiPw"></button>
      <button type="button" class="btn-ghost" data-close="pwModal" id="batalPwBtn"></button>
    </div>
  </div>
</div>

<script src="lang.js"></script>
<script>
(function(){
"use strict";

const SUPABASE_URL="https://rqqcdbbbcvhfjxznpowh.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_hTtIwFW3VFZj9p6qthAb3w_HbP5lVjs";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;");

let USER=null;

function tr(key){ return typeof window.t==="function" ? window.t(key) : key; }

function iconSvg(name){
  const icons={
    mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
    lock:'<rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'
  };
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">'+(icons[name]||"")+'</svg>';
}
function chevSvg(){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';
}

function bukaModal(id){ $(id).classList.add("show"); }
function tutupModal(id){ $(id).classList.remove("show"); }

function setMsg(el, teks, jenis){
  el.textContent = teks;
  el.className = "form-msg show" + (jenis ? " "+jenis : "");
}
function clearMsg(el){
  el.textContent = "";
  el.className = "form-msg";
}

function updateTexts(){
  $("topbarTitle").textContent = tr("settings.title");
  $("loadingText").textContent = tr("settings.perluMasuk");

  $("emailModalTitle").textContent = tr("modal.gantiEmail");
  $("emailModalSub").textContent = tr("modal.gantiEmailSub");
  $("emailModalLblBaru").textContent = tr("modal.emailBaru");
  $("emailBaru").placeholder = tr("modal.emailBaruPh");
  $("emailModalLblPw").textContent = tr("modal.pwSaatIni");
  $("emailPwSaatIni").placeholder = tr("modal.pwSaatIniPh");
  $("btnGantiEmail").textContent = tr("modal.gantiEmailBtn");
  $("batalEmailBtn").textContent = tr("modal.batal");

  $("pwModalTitle").textContent = tr("modal.gantiPwTitle");
  $("pwModalSub").textContent = tr("modal.gantiPwSub");
  $("pwModalLblSaatIni").textContent = tr("modal.pwSaatIni");
  $("pwSaatIni").placeholder = tr("modal.pwSaatIniPh");
  $("pwModalLblBaru").textContent = tr("modal.pwBaru");
  $("pwBaru").placeholder = tr("modal.pwBaruPh");
  $("pwModalLblKonfirmasi").textContent = tr("modal.pwKonfirmasi");
  $("pwKonfirmasi").placeholder = tr("modal.pwKonfirmasiPh");
  $("btnGantiPw").textContent = tr("modal.gantiPwBtn");
  $("batalPwBtn").textContent = tr("modal.batal");
}

async function init(){
  const root=$("root");

  try{
    const {data:sessionData}=await sb.auth.getSession();
    USER = sessionData && sessionData.session ? sessionData.session.user : null;
  }catch(e){
    console.error("[auth]",e);
  }

  if(!USER){
    $("loadingText").innerHTML='<a href="login.html" style="color:var(--gold);font-weight:600">'+tr("settings.masukSekarang")+'</a>';
    return;
  }

  root.innerHTML = ''
    +'<div class="label">'+tr("settings.labelAkunSaatIni")+'</div>'
    +'<div class="card">'
    +  '<div class="info-row"><span class="info-key">'+tr("settings.email")+'</span><span class="info-val">'+esc(USER.email||"-")+'</span></div>'
    +'</div>'

    +'<div class="label">'+tr("settings.labelAkun")+'</div>'
    +'<div class="menu-list">'
    +  '<button type="button" class="menu-row" id="rowGantiEmail">'
    +    '<div class="menu-icon">'+iconSvg("mail")+'</div>'
    +    '<div class="menu-text"><div class="menu-title">'+tr("settings.gantiEmail")+'</div><div class="menu-sub">'+tr("settings.gantiEmailSub")+'</div></div>'
    +    '<span class="menu-chev">'+chevSvg()+'</span>'
    +  '</button>'
    +  '<button type="button" class="menu-row" id="rowGantiPw">'
    +    '<div class="menu-icon">'+iconSvg("lock")+'</div>'
    +    '<div class="menu-text"><div class="menu-title">'+tr("settings.gantiPw")+'</div><div class="menu-sub">'+tr("settings.gantiPwSub")+'</div></div>'
    +    '<span class="menu-chev">'+chevSvg()+'</span>'
    +  '</button>'
    +'</div>';

  $("rowGantiEmail").addEventListener("click", function(){
    clearMsg($("emailMsg"));
    $("emailBaru").value="";
    $("emailPwSaatIni").value="";
    bukaModal("emailModal");
  });
  $("rowGantiPw").addEventListener("click", function(){
    clearMsg($("pwMsg"));
    $("pwSaatIni").value="";
    $("pwBaru").value="";
    $("pwKonfirmasi").value="";
    bukaModal("pwModal");
  });
}

document.querySelectorAll("[data-close]").forEach(function(b){
  b.addEventListener("click", function(){ tutupModal(b.getAttribute("data-close")); });
});
document.querySelectorAll(".modal").forEach(function(m){
  m.addEventListener("click", function(e){
    if(e.target===m) tutupModal(m.id);
  });
});

// --- Ganti Email ---
$("btnGantiEmail").addEventListener("click", async function(){
  const msgEl = $("emailMsg");
  clearMsg(msgEl);

  const emailBaru = $("emailBaru").value.trim();
  const pwSaatIni = $("emailPwSaatIni").value;

  if(!emailBaru || !/^\S+@\S+\.\S+$/.test(emailBaru)){
    setMsg(msgEl, tr("err.emailInvalid"), "err");
    return;
  }
  if(emailBaru.toLowerCase() === (USER.email||"").toLowerCase()){
    setMsg(msgEl, tr("err.emailSama"), "err");
    return;
  }
  if(!pwSaatIni){
    setMsg(msgEl, tr("err.pwSaatIniKosong"), "err");
    return;
  }

  const b=$("btnGantiEmail");
  b.disabled=true; b.textContent=tr("modal.memproses");

  const {error:errLogin} = await sb.auth.signInWithPassword({
    email: USER.email,
    password: pwSaatIni
  });

  if(errLogin){
    b.disabled=false; b.textContent=tr("modal.gantiEmailBtn");
    setMsg(msgEl, tr("err.pwSaatIniSalah"), "err");
    return;
  }

  const {error:errUpd} = await sb.auth.updateUser({ email: emailBaru });

  b.disabled=false; b.textContent=tr("modal.gantiEmailBtn");

  if(errUpd){
    setMsg(msgEl, errUpd.message || tr("err.gantiEmailGagal"), "err");
    return;
  }

  setMsg(msgEl, tr("ok.konfirmasiEmail"), "ok");
});

// --- Ganti Kata Sandi ---
$("btnGantiPw").addEventListener("click", async function(){
  const msgEl = $("pwMsg");
  clearMsg(msgEl);

  const pwSaatIni = $("pwSaatIni").value;
  const pwBaru = $("pwBaru").value;
  const pwKonfirmasi = $("pwKonfirmasi").value;

  if(!pwSaatIni){
    setMsg(msgEl, tr("err.pwSaatIniKosong"), "err");
    return;
  }
  if(!pwBaru || pwBaru.length < 6){
    setMsg(msgEl, tr("err.pwBaruKosong"), "err");
    return;
  }
  if(pwBaru !== pwKonfirmasi){
    setMsg(msgEl, tr("err.pwTidakCocok"), "err");
    return;
  }
  if(pwBaru === pwSaatIni){
    setMsg(msgEl, tr("err.pwSama"), "err");
    return;
  }

  const b=$("btnGantiPw");
  b.disabled=true; b.textContent=tr("modal.memproses");

  const {error:errLogin} = await sb.auth.signInWithPassword({
    email: USER.email,
    password: pwSaatIni
  });

  if(errLogin){
    b.disabled=false; b.textContent=tr("modal.gantiPwBtn");
    setMsg(msgEl, tr("err.pwSaatIniSalah"), "err");
    return;
  }

  const {error:errUpd} = await sb.auth.updateUser({ password: pwBaru });

  b.disabled=false; b.textContent=tr("modal.gantiPwBtn");

  if(errUpd){
    setMsg(msgEl, errUpd.message || tr("err.gantiPwGagal"), "err");
    return;
  }

  setMsg(msgEl, tr("ok.gantiPwBerhasil"), "ok");
  setTimeout(function(){
    tutupModal("pwModal");
  }, 1200);
});

document.addEventListener("langchange", updateTexts);

updateTexts();
init();

})();
</script>
</body>
</html>

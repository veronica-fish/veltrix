<style>
:root{
  --bg:#0A0A0B;--surface:#141416;--surface-2:#1A1A1D;
  --border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.14);
  --text:#F2F2F3;--text-2:#A0A0A8;--text-3:#6B6B74;
  --gold:#E8B923;--danger:#F87171;--ok:#5EE3B0;
  --sh:0 6px 20px rgba(232,185,35,.22);
  --rm:10px;--rd:14px;--rl:20px;--rf:999px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--gold);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}

.app{max-width:430px;margin:0 auto;min-height:100dvh;padding-bottom:40px}

.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;
  padding:12px 16px;background:rgba(10,10,11,.88);backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.back-btn{display:grid;place-items:center;width:34px;height:34px;flex:0 0 34px;
  border-radius:50%;background:var(--surface-2);border:1px solid var(--border)}
.back-btn svg{width:17px;height:17px}
.topbar-title{font-size:15px;font-weight:700;letter-spacing:-.01em;flex:1}

.lang-switch{display:flex;gap:4px}
.lang-btn{
  padding:4px 8px;border-radius:var(--rm);
  font-size:11px;font-weight:700;color:var(--text-3);
  border:1px solid var(--border);transition:color .15s,border-color .15s,background .15s;
}
.lang-btn.active{color:var(--gold);border-color:rgba(232,185,35,.4);background:rgba(232,185,35,.08)}

.wrap{padding:16px;display:flex;flex-direction:column;gap:12px}

.last-updated{font-size:11.5px;color:var(--text-3);text-align:center;
  padding:10px 16px;background:var(--surface-2);border-radius:var(--rd);
  border:1px solid var(--border)}

/* Kartu */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);
  overflow:hidden}
.card-head{display:flex;align-items:center;gap:10px;padding:16px;
  border-bottom:1px solid var(--border);cursor:pointer;user-select:none;
  -webkit-tap-highlight-color:transparent;transition:background .15s}
.card-head:active{background:var(--surface-2)}
.card-icon{width:32px;height:32px;flex:0 0 32px;border-radius:9px;
  background:rgba(232,185,35,.1);color:var(--gold);display:grid;place-items:center}
.card-icon svg{width:16px;height:16px}
.card-title{flex:1;font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.card-chev{color:var(--text-3);transition:transform .22s}
.card-chev svg{width:16px;height:16px}
.card[open] .card-chev{transform:rotate(90deg)}

.card-body{padding:16px;display:flex;flex-direction:column;gap:12px}

.prose{font-size:13px;line-height:1.8;color:var(--text-2)}
.prose p+p{margin-top:10px}
.prose b,.prose strong{color:var(--text);font-weight:600}
.prose em{color:var(--gold);font-style:normal;font-weight:600}

.reg-list{list-style:none;display:flex;flex-direction:column;gap:8px;
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--rd);
  padding:12px 14px}
.reg-list li{display:flex;gap:8px;font-size:12.5px;color:var(--text-2);line-height:1.6}
.reg-list li::before{content:"–";color:var(--gold);flex:0 0 auto}

.section-title{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-3);margin-bottom:4px}

.def-list{display:flex;flex-direction:column;gap:0}
.def-row{padding:11px 0}
.def-row+.def-row{border-top:1px solid var(--border)}
.def-term{font-size:12px;font-weight:700;color:var(--gold);margin-bottom:3px}
.def-desc{font-size:12.5px;color:var(--text-2);line-height:1.7}

.basis-list{display:flex;flex-direction:column;gap:10px}
.basis-box{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--rd);
  padding:12px 14px}
.basis-tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;padding:2px 8px;border-radius:var(--rf);
  background:rgba(232,185,35,.12);color:var(--gold);margin-bottom:7px}
.basis-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:5px}
.basis-desc{font-size:12.5px;color:var(--text-2);line-height:1.7}

.cookie-list{display:flex;flex-direction:column;gap:10px}
.cookie-box{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--rd);
  padding:12px 14px}
.cookie-name{font-size:12.5px;font-weight:700;color:var(--text);margin-bottom:4px}
.cookie-badge{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;padding:2px 7px;border-radius:var(--rf);margin-left:6px;
  vertical-align:middle}
.badge-required{background:rgba(248,113,113,.12);color:#FCA5A5}
.badge-optional{background:rgba(94,227,176,.1);color:var(--ok)}
.cookie-desc{font-size:12px;color:var(--text-2);line-height:1.7}

.manage-list{list-style:none;display:flex;flex-direction:column;gap:7px}
.manage-list li{display:flex;gap:8px;font-size:12.5px;color:var(--text-2);line-height:1.65}
.manage-list li .num{flex:0 0 18px;font-weight:700;color:var(--gold)}

.footer-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);
  padding:16px;text-align:center}
.footer-name{font-size:14px;font-weight:700;letter-spacing:.04em;color:var(--gold)}
.footer-sub{font-size:11.5px;color:var(--text-3);margin-top:4px;line-height:1.7}
</style>
</head>

  shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',

  edit:'<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4Z"/>'
};

function iconSvg(name){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[name]||"")+'</svg>';
}
function chevSvg(){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';
}

function renderCard(card, idx){
  let body = "";
  card.prose.forEach(function(p){ body += "<p>"+p+"</p>"; });
  body = '<div class="prose">'+body+'</div>';

  if(card.regList){
    body += '<div><div class="section-title">'+card.regListTitle+'</div><ul class="reg-list">';
    card.regList.forEach(function(item){ body += "<li><span>"+item+"</span></li>"; });
    body += '</ul></div>';
  }

  if(card.defList){
    body += '<div class="def-list">';
    card.defList.forEach(function(d){
      body += '<div class="def-row"><div class="def-term">'+d[0]+'</div><div class="def-desc">'+d[1]+'</div></div>';
    });
    body += '</div>';
  }

  if(card.basisList){
    body += '<div class="basis-list">';
    card.basisList.forEach(function(b){
      body += '<div class="basis-box"><div class="basis-tag">'+b[0]+'</div><div class="basis-title">'+b[1]+'</div><div class="basis-desc">'+b[2]+'</div></div>';
    });
    body += '</div>';
  }

  if(card.cookieList){
    body += '<div class="cookie-list">';
    card.cookieList.forEach(function(c){
      const badgeClass = c[2] ? "badge-required" : "badge-optional";
      body += '<div class="cookie-box"><div class="cookie-name">'+c[0]+' <span class="cookie-badge '+badgeClass+'">'+c[1]+'</span></div><div class="cookie-desc">'+c[3]+'</div></div>';
    });
    body += '</div>';
    body += '<div><div class="section-title">'+card.manageTitle+'</div><ul class="manage-list">';
    card.manageList.forEach(function(m, i){
      body += '<li><span class="num">('+String.fromCharCode(97+i)+')</span><span>'+m+'</span></li>';
    });
    body += '</ul></div>';
  }

  const cardId = "card"+idx;
  const openAttr = card.open ? " open" : "";
  const displayStyle = card.open ? "flex" : "none";

  return '<div class="card" id="'+cardId+'"'+openAttr+'>'
    +'<div class="card-head" onclick="toggle(\''+cardId+'\')">'
    +'<div class="card-icon">'+iconSvg(card.icon)+'</div>'
    +'<div class="card-title">'+card.title+'</div>'
    +'<div class="card-chev">'+chevSvg()+'</div>'
    +'</div>'
    +'<div class="card-body" style="display:'+displayStyle+'">'+body+'</div>'
    +'</div>';
}

function render(){
  const d = DATA[currentLang] || DATA.id;
  document.title = d.topbarTitle+" — VELTRIX";
  $("topbarTitle").textContent = d.topbarTitle;

  let html = '<div class="last-updated">'+d.lastUpdated+'</div>';
  d.cards.forEach(function(card, i){ html += renderCard(card, i+1); });
  html += '<div class="footer-card"><div class="footer-name">PT Sotta Teknologi Indonesia</div><div class="footer-sub">'+d.footerSub+'</div></div>';

  $("root").innerHTML = html;

  document.querySelectorAll(".lang-btn").forEach(function(b){
    b.classList.toggle("active", b.dataset.lang===currentLang);
  });
}

function toggle(id){
  var card=document.getElementById(id);
  var body=card.querySelector(".card-body");
  var isOpen=card.hasAttribute("open");
  if(isOpen){
    card.removeAttribute("open");
    body.style.display="none";
  } else {
    card.setAttribute("open","");
    body.style.display="flex";
  }
}
window.toggle=toggle;

document.querySelectorAll(".lang-btn").forEach(function(btn){
  btn.addEventListener("click", function(){
    currentLang = btn.dataset.lang;
    if(typeof window.setLang === "function") window.setLang(currentLang);
    render();
  });
});

document.addEventListener("langchange", function(e){
  if(e && e.detail && e.detail.lang) currentLang = e.detail.lang;
  render();
});

render();
})();
</script>
